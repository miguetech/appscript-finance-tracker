name: Deploy Apps Script

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Configure clasp auth
        run: |
          echo "${{ secrets.CLASPRC_JSON }}" > ~/.clasprc.json
          echo '{"scriptId":"${{ secrets.CLASP_SCRIPT_ID }}","rootDir":"."}' > .clasp.json
          chmod 600 ~/.clasprc.json

      - name: Push code
        run: clasp push -f

      - name: Run tests
        run: clasp run runTests
        continue-on-error: true
